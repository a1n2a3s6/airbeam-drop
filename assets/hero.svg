<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="1200" height="350">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080C" />
      <stop offset="55%" stop-color="#0C111B" />
      <stop offset="100%" stop-color="#08161A" />
    </linearGradient>
    <radialGradient id="cyanGlow" cx="80%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.26" />
      <stop offset="65%" stop-color="#10B981" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#06080C" stop-opacity="0" />
