    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#18202C" stroke-width="0.9" />
    </pattern>
    <style>
      .wave1 { animation: ping 2.4s ease-out infinite; transform-origin: 960px 175px; }
      .wave2 { animation: ping 2.4s ease-out 0.8s infinite; transform-origin: 960px 175px; }
      .wave3 { animation: ping 2.4s ease-out 1.6s infinite; transform-origin: 960px 175px; }
      .dot-pulse { animation: blink 1.5s ease-in-out infinite; }
      @keyframes ping {
        0% { transform: scale(0.5); opacity: 0.9; }
        100% { transform: scale(1.8); opacity: 0; }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
    </style>
  </defs>

  <rect width="1200" height="350" rx="20" fill="url(#bg)" />
